<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" /> <!-- Kendi logonuzun (favicon) yolunu buraya yazın -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- TEMEL SEO ETİKETLERİ -->
    <!-- Google'da görünecek mavi başlık (En fazla 60 karakter önerilir) -->
    <title>Dayıoğlu İnşaat | Samsun İnşaat ve Konut Projeleri</title>
    
    <!-- Google'da başlığın altında görünecek açıklama metni (En fazla 160 karakter önerilir) -->
    <meta name="description" content="2015 yılından bugüne Samsun'da güvenilir, modern ve kaliteli inşaat projeleri hayata geçiriyoruz. Dayıoğlu İnşaat güvencesiyle yeni yaşam alanlarını keşfedin." />
    
    <!-- Anahtar kelimeler (Google artık çok dikkate almasa da diğer arama motorları için faydalıdır) -->
    <meta name="keywords" content="Samsun inşaat, Dayıoğlu İnşaat, konut projeleri, anahtar teslim yapı, müteahhitlik" />
    
    <!-- Yazar/Firma bilgisi -->
    <meta name="author" content="Dayıoğlu İnşaat" />

    <!-- OPEN GRAPH (WHATSAPP VE SOSYAL MEDYA PAYLAŞIM ETİKETLERİ) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dayıoğlu İnşaat | Samsun" />
    <meta property="og:description" content="2015'ten beri Samsun'da güvenle inşa ediyoruz. Güncel projelerimiz için web sitemizi ziyaret edin." />
    <!-- WhatsApp'ta link atıldığında çıkacak görselin tam adresi (Sitenize yüklediğiniz bir logonun linki olmalı) -->
    <meta property="og:image" content="https://www.dayiogluinsaat.com.tr/logo-sosyal-medya.jpg" />
    <meta property="og:url" content="https://www.dayiogluinsaat.com.tr/" />
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
